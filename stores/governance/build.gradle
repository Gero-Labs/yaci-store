dependencies {
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.4'
    implementation 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
    implementation 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
    api project(":components:common")
    api project(":components:events")
    api project(":components:core")
    api project(":components:client")
    api project(":components:plugin")
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yaci Store Governance'
                description = 'Yaci Store Governance Module'
            }
        }
    }
}
