import org.gradle.api.publish.maven.MavenPublication

// Docker Engine 29 requires the current Testcontainers API negotiation.
ext['testcontainers.version'] = '1.21.4'

dependencies {

    api project(":extensions:blockfrost:blockfrost-common")
    api project(":stores:blocks")
    api project(":stores:governance")
    api project(":stores-api:governance-api")
    api project(":aggregates:governance-aggr")
    api project(":aggregates:account")
    api project(":aggregates:adapot")
    api project(":stores:staking")
    api project(":stores:transaction")
    api project(":stores:utxo")

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.jooq:jooq'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.postgresql:postgresql'

}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yaci Store Blockfrost Governance'
                description = 'Yaci Store Blockfrost Governance API'
            }
        }
    }
}
