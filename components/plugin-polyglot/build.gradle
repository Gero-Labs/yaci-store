dependencies {
    compileOnly project(":components:plugin")

    api libs.graalvm.polyglot
    api libs.graalvm.js
    api libs.graalvm.python

    compileOnly libs.apache.commons.pool

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(":components:plugin")
    testImplementation libs.apache.commons.pool
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yaci Store - Plugin Extra Module'
                description = 'Yaci Store - Plugin Extra Module'
            }
        }
    }
}


task copyDeps(type: Copy) {
    into("$buildDir/libs/plugin-libs")
    from(configurations.runtimeClasspath) {
        include { file -> file.name.toLowerCase().endsWith('.jar') }
    }
}

build.dependsOn(copyDeps)

// Fork-only diagnostics for the Leios compatibility build.
tasks.named('test') {
    dependsOn(':stores:script:test', ':components:submit:test')
    testLogging {
        exceptionFormat = 'full'
        showCauses = true
    }
}

[project(':stores:script'), project(':components:submit')].each { target ->
    target.tasks.withType(Test).configureEach {
        afterTest { descriptor, result ->
            if (descriptor.className.contains('Guarding')) {
                logger.lifecycle("${descriptor.className}.${descriptor.name}: ${result.resultType}")
            }
        }
    }
}

