import org.gradle.api.publish.maven.MavenPublication

// Boot's older Testcontainers BOM cannot start PostgreSQL on Docker Engine29.
ext['testcontainers.version'] = '1.21.4'

dependencies {
    api project(":extensions:blockfrost:blockfrost-common")
    api project(":stores:metadata")
    api project(":stores-api:metadata-api")

    implementation 'org.springframework.boot:spring-boot-starter-web'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.1'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yaci Store Blockfrost Metadata'
                description = 'Yaci Store Blockfrost Metadata API'
            }
        }
    }
}
